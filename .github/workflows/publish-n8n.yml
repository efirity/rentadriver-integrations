name: Publish RentADriver n8n node

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact n8n package version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-n8n
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'efirity/rentadriver-integrations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-n8n
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: n8n/package-lock.json
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "n8n-nodes-rentadriver" || p.version !== process.env.RELEASE_VERSION) throw new Error("Requested version does not match package.json");'
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Inspect publishable package
        run: npm pack --dry-run
      - name: Publish with provenance
        # Configure npm Trusted Publishing for this repository, workflow and environment.
        # A first publication can use a short-lived granular token via this environment's secret.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
