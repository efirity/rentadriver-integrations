# TLS in front of WordPress: WooCommerce only accepts REST key pairs when is_ssl() is true. default_server + a cert with
# the host IP in its SAN means no SNI is required, so the API can call the store by IP (with TLS verification off).
server {
  listen 8443 ssl default_server;
  http2 on;
  ssl_certificate     /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  client_max_body_size 64m;
  # Typing the bare host:port in a browser sends plain http to the TLS port; nginx answers 497. Redirect instead of
  # showing "400 Bad Request: The plain HTTP request was sent to HTTPS port".
  error_page 497 =301 https://$host$request_uri;
  location / {
    proxy_pass http://wp:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
